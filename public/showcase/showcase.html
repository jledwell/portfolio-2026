<style>
  html, body { margin: 0; min-height: 100%; background: var(--bg-page); }
  html { scroll-behavior: smooth; }
  * { box-sizing: border-box; }

  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 var(--container-pad); }
  .wrap-wide { max-width: 1920px; margin: 0 auto; padding: 0 var(--container-pad); }

  /* ---- sticky header ---- */
  .site-header {
    position: sticky; top: 0; z-index: 50;
    background: rgba(253, 251, 247, 0.86);
    backdrop-filter: saturate(1.1) blur(8px);
    border-bottom: 1px solid var(--border-default);
  }
  .site-header__inner {
    max-width: none; margin: 0; padding: 14px var(--container-pad);
    min-height: 72px; display: flex; align-items: center; justify-content: space-between; gap: var(--space-6);
  }
  .header-left { display: flex; flex-direction: column; align-items: flex-start; margin-right: auto; min-width: 0; }
  .brand { display: flex; align-items: center; gap: var(--space-3); text-decoration: none; }
  .brand__mark {
    width: 38px; height: 38px; border-radius: var(--radius-full);
    object-fit: cover; display: block;
    box-shadow: var(--shadow-sm);
    border: 2px solid var(--warm-terracotta);
  }
  .brand__name { font-family: var(--font-heading); font-size: 16px; color: var(--text-heading); line-height: 1.1; white-space: nowrap; }
  .brand__role { font-size: 12px; color: var(--text-muted); letter-spacing: 0.02em; }
  .header-note {
    margin: 6px 0 0; text-align: left;
    font-size: 12px; line-height: 1.45; color: var(--text-muted);
  }

  nav.tabs { display: flex; align-items: center; gap: var(--space-1); }
  nav.tabs a {
    font-family: var(--font-body); font-size: 14px; font-weight: 600;
    color: var(--text-muted); text-decoration: none;
    padding: 8px 14px; border-radius: var(--radius-full);
    transition: color var(--duration-fast) var(--ease-standard), background var(--duration-fast) var(--ease-standard);
    white-space: nowrap;
  }
  nav.tabs a:hover { color: var(--text-heading); background: var(--surface-tint); }
  nav.tabs a.active { color: var(--warm-terracotta); background: var(--surface-tint); }

  /* ---- hero ---- */
  .hero { padding: 0; }
  .hero h1 { margin: 0 0 14px; font-size: 56px; line-height: 1.05; letter-spacing: -0.02em; }
  .hero .lede { font-size: 19px; color: var(--text-muted); line-height: 1.7; max-width: 620px; margin: 0; }
  .hero .who { display: flex; align-items: center; gap: var(--space-4); margin-bottom: var(--space-8); }
  .hero .who .name { font-family: var(--font-heading); font-size: 18px; color: var(--text-heading); line-height: 1.2; }
  .hero .who .title { font-size: 14px; color: var(--warm-terracotta); font-weight: 600; }

  /* ---- section ---- */
  section.work { padding: var(--space-8) 0; scroll-margin-top: 88px; }
  section.work:first-of-type { border-top: none; padding-top: var(--space-6); }
  .sec-head { display: flex; align-items: baseline; gap: var(--space-4); flex-wrap: wrap; margin-bottom: 0; }
  .sec-head-group { margin-bottom: var(--space-10); }
  .sec-sub { margin: var(--space-3) 0 0; font-family: var(--font-heading); font-size: 20px; line-height: 1.3; color: var(--warm-terracotta); font-weight: 400; }
  .subsec-head { font-family: var(--font-heading); font-size: 20px; color: var(--warm-terracotta); font-weight: 400; line-height: 1.3; margin: var(--space-12) 0 var(--space-6); }
  .sec-num { font-family: var(--font-heading); font-size: 18px; color: var(--warm-coral); }
  section.work h2 { margin: 0; font-size: 34px; letter-spacing: -0.02em; }
  .sec-lede { font-size: 17px; color: var(--text-muted); line-height: 1.7; max-width: 680px; margin: 0 0 var(--space-10); }

  /* ---- screen frame ---- */
  .frame { overflow: hidden; padding: 0 !important; box-shadow: var(--shadow-lg) !important; }
  .frame__chrome {
    height: 40px; display: flex; align-items: center; gap: 7px;
    padding: 0 16px; background: var(--surface-tint); border-bottom: 1px solid var(--border-default);
  }
  .frame__chrome i { width: 11px; height: 11px; border-radius: 50%; display: block; }
  .frame__chrome .d1 { background: #e89a7f; }
  .frame__chrome .d2 { background: #f0c66b; }
  .frame__chrome .d3 { background: #9bbf9f; }
  .frame__chrome .label { margin-left: 10px; font-size: 12px; color: var(--text-muted); font-weight: 600; letter-spacing: 0.04em; }
  .frame img { display: block; width: 100%; height: auto; }
  .frame__foot { padding: var(--space-6) var(--space-8); border-top: 1px solid var(--border-default); background: var(--white); }
  .frame__foot h3 { margin: 0 0 6px; font-size: 19px; }
  .frame__foot p { margin: 0; font-size: 14px; color: var(--text-muted); line-height: 1.65; }

  .gallery { display: flex; flex-direction: column; gap: var(--space-10); }
  .center-narrow { max-width: 600px; margin: 0 auto; width: 100%; }

  /* ---- empty / fillable ---- */
  /* 1-up: single fixed 550×350 tile, centered when the viewport has extra width */
  .slot-grid, .param-grid { display: grid; grid-template-columns: 550px; justify-content: center; gap: var(--space-8); }
  .grid-frame {
    width: 550px; height: 350px; position: relative; border-radius: var(--radius-lg); overflow: hidden;
    box-shadow: var(--shadow-lg); border: 1px solid var(--border-default); background: var(--white);
  }
  .grid-frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .frame-padded {
    background: rgba(0, 0, 0, 0.67); display: flex; align-items: center; justify-content: center;
    border: none;
  }
  .frame-padded image-slot {
    width: 75%; height: auto; aspect-ratio: 800 / 547;
    border-radius: var(--radius-md); border: none;
  }
  .frame-embed { padding: 0; background: var(--white); }
  .frame-embed iframe { width: 100%; height: 100%; border: 0; display: block; }
  .slot-cell { display: flex; flex-direction: column; gap: var(--space-3); }
  image-slot {
    width: 550px; height: 350px; display: block;
    border: 1px dashed var(--border-default); border-radius: var(--radius-lg);
    background: var(--white);
  }
  /* 2-up: two fixed 550×350 tiles side by side, centered */
  @media (min-width: 1180px) {
    .slot-grid, .param-grid { grid-template-columns: repeat(2, 550px); }
  }
  .slot-cap { font-size: 13px; color: var(--text-muted); padding-left: 2px; }
  .empty-note {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 13px; color: var(--text-muted); margin-bottom: var(--space-6);
  }
  .empty-note i { width: 15px; height: 15px; }

  footer.site-footer {
    border-top: 1px solid var(--border-default); padding: var(--space-12) 0;
    text-align: center; color: var(--text-muted); font-size: 13px;
  }
  .contact-link {
    font-family: var(--font-heading); font-size: 20px; font-weight: 400; line-height: 1.3;
    color: var(--warm-terracotta); text-decoration: none;
  }
  .contact-link:hover { text-decoration: underline; }

  /* ---- lightbox (2-up, >=1180px) ---- */
  .lightbox {
    position: fixed; inset: 0; z-index: 200;
    display: flex; align-items: center; justify-content: center;
    padding: 24px; background: rgba(44, 37, 32, 0.74);
    cursor: zoom-out; animation: lb-fade var(--duration-normal) var(--ease-standard);
  }
  @keyframes lb-fade { from { opacity: 0; } to { opacity: 1; } }
  .lightbox img {
    width: 1000px; height: 500px; object-fit: cover;
    max-width: calc(100vw - 48px); max-height: calc(100vh - 48px);
    border-radius: var(--radius-lg); box-shadow: var(--shadow-lg);
    background: var(--white); border: 2px solid var(--warm-terracotta);
    cursor: default;
  }
  .lightbox__close {
    position: absolute; top: 20px; right: 24px;
    width: 42px; height: 42px; border-radius: var(--radius-full);
    display: flex; align-items: center; justify-content: center;
    background: var(--white); border: 1px solid var(--border-default);
    box-shadow: var(--shadow-md); cursor: pointer; color: var(--text-heading);
    transition: transform var(--duration-fast) var(--ease-standard);
  }
  .lightbox__close:hover { transform: translateY(-1px); }
  .lightbox__close i { width: 20px; height: 20px; }
  /* full diagram: natural 1000×500, never upscaled; only shrinks on small viewports */
  .lightbox img.lightbox__full {
    width: 1000px; height: auto; object-fit: contain;
    max-width: calc(100vw - 48px); max-height: calc(100vh - 48px);
    border-radius: var(--radius-lg); box-shadow: var(--shadow-lg);
    background: var(--white); border: 2px solid var(--warm-terracotta);
    cursor: default;
  }
  .img-zoom { cursor: zoom-in; }
  @media (min-width: 1180px) {
    image-slot[data-filled] { cursor: zoom-in; }
  }

  @media (max-width: 760px) {
    nav.tabs { display: none; }
    .hero h1 { font-size: 40px; }
    .brand__role { display: none; }
  }
</style>

  const { Card } = DS;
  if (!Card) return null;
  return (
    <div className={narrow ? 'center-narrow' : ''}>
      <Card className="frame">
        <img src={src} alt={alt} />
        <div className="frame__foot">
          <h3>{title}</h3>
          <p>{caption}</p>
        </div>
      </Card>
    </div>
  );
}

function FillableSection({ id, padded, slots = [1, 2, 3, 4], captions = {}, images = {} }) {
  return (
    <React.Fragment>
      <div className="slot-grid">
        {slots.map((n) => (
          <div className="slot-cell" key={n}>
            {images[n]
              ? <div className="grid-frame img-zoom" data-full={images[n]}><img src={images[n]} alt={captions[n] || ''} /></div>
              : padded
                ? <div className="grid-frame frame-padded"><image-slot id={`${id}-${n}`} shape="rounded" radius="8" placeholder="Drop a visual"></image-slot></div>
                : <image-slot id={`${id}-${n}`} shape="rounded" radius="12" placeholder="Drop a visual"></image-slot>}
            <span className="slot-cap">{captions[n] || 'Lorem ipsum'}</span>
          </div>
        ))}
      </div>
    </React.Fragment>
  );
}

function ParametersContent() {
  const cells = [
    { type: 'embed', src: 'propagation-diagram.html', title: 'Hierarchical data propagation diagram', cap: 'Hierarchical data propagation' },
    { type: 'slot', id: 'parameters-2', cap: 'Desktop · High data density' },
    { type: 'slot', id: 'parameters-1', cap: 'Data Coordination · Medium density', padded: true },
    { type: 'slot', id: 'parameters-4', cap: 'Data Selection · Low density' },
    { type: 'slot', id: 'parameters-5', cap: 'Dynamo Player redesign for better prompts and hierarchy' },
    { type: 'image', src: 'assets/dynamo-player-customer-example.gif', alt: 'Dynamo Player customer example', cap: 'Lorem ipsum' },
  ];
  return (
    <React.Fragment>
      <div className="param-grid">
        {cells.map((c, i) => (
          <div className="slot-cell" key={i}>
            {c.type === 'image'
              ? <div className="grid-frame"><img src={c.src} alt={c.alt} /></div>
              : c.type === 'embed'
                ? <div className="grid-frame frame-embed"><iframe src={c.src} title={c.title} loading="lazy"></iframe></div>
              : c.padded
                ? <div className="grid-frame frame-padded"><image-slot id={c.id} shape="rounded" radius="8" placeholder="Drop a visual"></image-slot></div>
                : <image-slot id={c.id} shape="rounded" radius="12" placeholder="Drop a visual"></image-slot>}
            <span className="slot-cap">{c.cap}</span>
          </div>
        ))}
      </div>
      <h3 className="subsec-head">Design System</h3>
      <div className="slot-grid">
        <div className="slot-cell">
          <image-slot id="design-system-1" shape="rounded" radius="12" placeholder="Drop a visual"></image-slot>
          <span className="slot-cap">Data density in T-shirt size options</span>
        </div>
        <div className="slot-cell">
          <image-slot id="design-system-2" shape="rounded" radius="12" placeholder="Drop a visual"></image-slot>
          <span className="slot-cap">Search and Filter Density options</span>
        </div>
        <div className="slot-cell">
          <div className="grid-frame frame-embed">
            <iframe src={FIGMA_EMBED} title="Parameters Platform UI prototype" allowFullScreen></iframe>
          </div>
          <span className="slot-cap">Component anatomy example</span>
        </div>
      </div>
    </React.Fragment>
  );
}

function Page() {
  const DS = window.JoshuaLedwellDesignSystem_cb2884 || {};
  const { Avatar, Badge } = DS;
  const active = useActiveSection();
  const [zoomSrc, setZoomSrc] = React.useState(null);
  const [zoomFull, setZoomFull] = React.useState(null);
  const clickTimer = React.useRef(null);

  React.useEffect(() => {
    const mq = window.matchMedia('(min-width: 1180px)');
    const openFrom = (slot) => {
      const img = slot.shadowRoot && slot.shadowRoot.querySelector('img[part="image"]');
      const src = img && img.getAttribute('src');
      if (src) setZoomSrc(src);
    };
    const onClick = (e) => {
      // fixed diagram tiles open at natural size, any width
      const zt = e.target.closest && e.target.closest('.img-zoom[data-full]');
      if (zt) { setZoomFull(zt.getAttribute('data-full')); return; }
      if (!mq.matches) return;
      const path = e.composedPath ? e.composedPath() : [];
      // ignore the slot's own Replace/Remove controls
      if (path.some((el) => el.getAttribute && el.getAttribute('data-act'))) return;
      const slot = e.target.closest && e.target.closest('image-slot[data-filled]');
      if (!slot || slot.hasAttribute('data-reframe')) return;
      // defer so a double-click (reframe) can cancel the zoom
      if (clickTimer.current) clearTimeout(clickTimer.current);
      clickTimer.current = setTimeout(() => { clickTimer.current = null; openFrom(slot); }, 220);
    };
    const onDbl = () => {
      if (clickTimer.current) { clearTimeout(clickTimer.current); clickTimer.current = null; }
    };
    document.addEventListener('click', onClick);
    document.addEventListener('dblclick', onDbl);
    return () => {
      document.removeEventListener('click', onClick);
      document.removeEventListener('dblclick', onDbl);
      if (clickTimer.current) clearTimeout(clickTimer.current);
    };
  }, []);

  React.useEffect(() => {
    if (!zoomSrc && !zoomFull) return;
    const onKey = (e) => { if (e.key === 'Escape') { setZoomSrc(null); setZoomFull(null); } };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [zoomSrc, zoomFull]);

  React.useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

  if (!Avatar) return null;

  return (
    <React.Fragment>
      <header className="site-header">
        <div className="site-header__inner">
          <div className="header-left">
            <a className="brand" href="#top">
              <img className="brand__mark" src="assets/profile-picture.jpg" alt="Joshua Ledwell" />
              <span>
                <span className="brand__name" style={{ display: 'block', whiteSpace: 'nowrap' }}>Joshua Ledwell</span>
                <span className="brand__role">Product Designer</span>
              </span>
            </a>
            <p className="header-note">All examples are shipped and publicly available, redacted, and/or shown with permission.</p>
          </div>
        </div>
      </header>

      <main id="top">
        <div className="wrap">
          <div className="hero">
          </div>
        </div>

        {SECTIONS.map((s) => (
          <section className="work" id={s.id} key={s.id} data-screen-label={s.title}>
            <div className="wrap-wide">
              <div className="sec-head-group">
                <div className="sec-head">
                  {!s.hideTitle ? <h2>{s.title}</h2> : null}
                </div>
                {s.sub ? <p className="sec-sub">{s.sub}</p> : null}
              </div>
              {s.id === 'parameters' ? <ParametersContent /> : s.id === 'design-system' ? <FillableSection id={s.id} slots={[3, 4, 5]} captions={{ 3: 'Phased Experience Vision', 4: 'Live Facilitation', 5: 'Remote Online Design and Feedback Facilitation' }} images={{ 3: 'assets/experience-vision-1000.png' }} /> : <FillableSection id={s.id} padded={s.padded} />}
            </div>
          </section>
        ))}

        <footer className="site-footer">
          <div className="wrap">
            <a className="contact-link" href="mailto:jledwell@gmail.com">Contact</a>
          </div>
        </footer>
      </main>

      {zoomSrc ? (
        <div className="lightbox" onClick={() => setZoomSrc(null)}>
          <button className="lightbox__close" aria-label="Close" onClick={() => setZoomSrc(null)}>
            <i data-lucide="x"></i>
          </button>
          <img src={zoomSrc} alt="" onClick={(e) => e.stopPropagation()} />
        </div>
      ) : null}

      {zoomFull ? (
        <div className="lightbox" onClick={() => setZoomFull(null)}>
          <button className="lightbox__close" aria-label="Close" onClick={() => setZoomFull(null)}>
            <i data-lucide="x"></i>
          </button>
          <img className="lightbox__full" src={zoomFull} alt="" onClick={(e) => e.stopPropagation()} />
        </div>
      ) : null}
    </React.Fragment>
  );
}

(function mount() {
  const el = document.getElementById('root');
  if (!el) { setTimeout(mount, 30); return; }
  const root = ReactDOM.createRoot(el);
  root.render(<Page />);
  const t = setInterval(() => {
    if (window.JoshuaLedwellDesignSystem_cb2884) { clearInterval(t); root.render(<Page />); if (window.lucide) window.lucide.createIcons(); }
  }, 60);
  setTimeout(() => clearInterval(t), 4000);
})();
</script>
</body>
</html>
