<style>
  .ph-wrap { padding: 0.5rem 0 0; }

  .ph-seg button { border:none; border-right:0.5px solid #C9BBA8; background:transparent; padding:7px 12px; font-size:13px; cursor:pointer; color:#685E53; transition:background .15s, color .15s; }
  .ph-seg button:last-child { border-right:none; }

  .ph-fire { border:0.5px solid #C9BBA8; background:transparent; padding:8px 16px; font-size:13px; border-radius:var(--border-radius-md); cursor:pointer; color:#2A2521; display:inline-flex; align-items:center; gap:6px; transition:background .15s; }

  .pkt { opacity:0; }
  .node-card { transition:fill .4s, stroke .4s, stroke-width .4s; }
  .node-badge { opacity:0; transition:opacity .3s; }
  .conn { stroke-dasharray:6 6; }

  .mono { font-family:var(--font-mono); }

  @media (prefers-color-scheme: dark){ .persona-icon { filter:invert(1); opacity:0.7; } }

<script>
(function(){
  var mode = 'flag';
  var segs = document.querySelectorAll('#ph-mode button');
  segs.forEach(function(b){
    b.addEventListener('click', function(){
      segs.forEach(function(x){x.classList.remove('active');});
      b.classList.add('active');
      mode = b.getAttribute('data-mode');
    });
  });

  var conns = ['c0','c1','c2','c3'].map(function(id){return document.getElementById(id);});
  var pkts  = ['p0','p1','p2','p3'].map(function(id){return document.getElementById(id);});
  var cards = ['n0','n1','n2','n3'].map(function(id){return document.getElementById(id).querySelector('.node-card');});
  var badges= ['b0','b1','b2','b3'].map(function(id){return document.getElementById(id);});

  var values = ['hours','days','minutes','weeks'];
  var srcVal = document.getElementById('src-val');
  var vi = 0;

  // packets travel to the top-center of each dashed box
  var endpoints = [
    {x1:340,y1:140,x2:157,y2:232},
    {x1:340,y1:140,x2:257,y2:402},
    {x1:340,y1:140,x2:509,y2:232},
    {x1:340,y1:140,x2:597,y2:402}
  ];

  function reset(){
    cards.forEach(function(c){
      c.setAttribute('fill','#F3EEE5');
      c.setAttribute('stroke','#DDCDBB');
      c.setAttribute('stroke-width','0.75');
    });
    badges.forEach(function(b){b.style.opacity=0;});
  }

  function settle(i){
    var card = cards[i], badge = badges[i];
    var color, cardFill, stroke;
    if(mode==='instant'){ color='#839C80'; cardFill='#E7EDE5'; stroke='#5E7B5B'; }
    else if(mode==='flag'){ color='#C17854'; cardFill='#FBEDE3'; stroke='#A35E3C'; }
    else {
      if(i===0){ color='#839C80'; cardFill='#E7EDE5'; stroke='#5E7B5B'; }
      else { color='#A89F92'; cardFill='#F3EEE5'; stroke='#DDCDBB'; }
    }
    card.setAttribute('fill',cardFill);
    card.setAttribute('stroke',stroke);
    card.setAttribute('stroke-width', mode==='newonly'&&i>0 ? '0.75':'1.25');
    badge.setAttribute('fill',color);
    badge.style.opacity = (mode==='newonly'&&i>0) ? 0.35 : 1;
  }

  function fire(){
    reset();
    vi = (vi+1)%values.length;
    srcVal.textContent = values[vi];
    conns.forEach(function(c){c.classList.add('animating');});

    pkts.forEach(function(p,i){
      var e = endpoints[i];
      p.setAttribute('cx',e.x1); p.setAttribute('cy',e.y1); p.style.opacity=0;
      var delay = i*120;
      var dur = 1000;
      var start = null;
      setTimeout(function(){
        p.style.opacity=1;
        function step(ts){
          if(!start) start=ts;
          var t = Math.min((ts-start)/dur,1);
          var ease = t<0.5 ? 2*t*t : -1+(4-2*t)*t;
          p.setAttribute('cx', e.x1+(e.x2-e.x1)*ease);
          p.setAttribute('cy', e.y1+(e.y2-e.y1)*ease);
          if(t<1){ requestAnimationFrame(step); }
          else { p.style.opacity=0; settle(i); }
        }
        requestAnimationFrame(step);
      }, delay);
    });

    setTimeout(function(){ conns.forEach(function(c){c.classList.remove('animating');}); }, 1500);
  }

  document.getElementById('ph-fire').addEventListener('click', fire);
})();
</script>
